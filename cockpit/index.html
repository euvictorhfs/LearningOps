<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>LearningOps Cockpit</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--panel2:#17213a;--line:#273452;--text:#eef3ff;--muted:#91a0bd;--accent:#7dd3fc;--good:#86efac;--warn:#fde68a;--bad:#fca5a5;--radius:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#09101f,#0e1424 45%,#0b1020);color:var(--text)}button,input{font:inherit}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:30;background:rgba(11,16,32,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topbar-inner{max-width:1280px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#38bdf8,#818cf8);box-shadow:0 0 30px rgba(56,189,248,.18)}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.pill{border:1px solid var(--line);background:#11192c;color:var(--muted);padding:7px 10px;border-radius:999px;font-size:12px}.layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:230px 1fr;gap:18px;padding:18px}.sidebar{position:sticky;top:82px;height:calc(100vh - 100px);align-self:start;background:rgba(18,26,46,.72);border:1px solid var(--line);border-radius:var(--radius);padding:12px}.navbtn{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 12px;border-radius:12px;cursor:pointer;margin:2px 0}.navbtn:hover,.navbtn.active{background:var(--panel2);color:var(--text)}.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#60708f;padding:14px 12px 6px}.main{min-width:0}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:6px 0 18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}h1{font-size:30px;margin:5px 0 5px}h2{font-size:18px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(23,33,58,.95),rgba(18,26,46,.95));border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}.kpi-label{color:var(--muted);font-size:12px}.kpi{font-size:30px;font-weight:750;margin:6px 0}.bar{height:8px;background:#202a45;border-radius:999px;overflow:hidden}.bar span{height:100%;display:block;background:linear-gradient(90deg,#38bdf8,#818cf8)}.domains{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.domain-card{cursor:pointer}.domain-card:hover{border-color:#46628f}.domain-title{display:flex;justify-content:space-between;gap:12px}.score{font-size:38px;font-weight:780;margin:18px 0 1px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.mini{background:#11192d;border:1px solid #202d49;border-radius:12px;padding:10px}.mini b{display:block}.mini small{font-size:10px;color:var(--muted)}.status{display:inline-flex;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;white-space:nowrap}.empty{border:1px dashed #344361;border-radius:14px;padding:14px;color:var(--muted);font-size:12px;margin-top:14px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#11192c;color:var(--muted);padding:8px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}.tab.active{background:#1c2a49;color:var(--text);border-color:#42577c}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 12px;border:1px solid #22304e;border-radius:12px;background:#11192d}.row small{color:var(--muted)}.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:#1a2743;color:#a9bbda}.badge.zero{background:#182238;color:#8fa0be}.badge.good{background:#123424;color:#9ceab8}.badge.warn{background:#3a3214;color:#f7e29b}.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:#34415e}.event{position:relative;margin:0 0 15px}.event:before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:#5fa8d8;border:2px solid #11192d}.graph-wrap{position:relative;height:360px;border:1px solid #273452;border-radius:16px;background:radial-gradient(circle at 50% 50%,#19233d,#10172a 70%);overflow:hidden}.gnode{position:absolute;transform:translate(-50%,-50%);padding:9px 12px;border:1px solid #48618e;background:#16213a;border-radius:999px;font-size:11px;white-space:nowrap}.gnode.dim{border-color:#2b3753;color:#8291ad}.whiteboard{position:relative;height:430px;overflow:hidden;border:1px solid #273452;border-radius:16px;background-color:#0f1729;background-image:linear-gradient(#1d2944 1px,transparent 1px),linear-gradient(90deg,#1d2944 1px,transparent 1px);background-size:24px 24px;touch-action:none}.wnode{position:absolute;min-width:120px;padding:11px;border-radius:12px;background:#1b2948;border:1px solid #5772a1;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:grab;user-select:none}.wnode:active{cursor:grabbing}.wb-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.btn{border:1px solid var(--line);background:#18223a;color:var(--text);padding:8px 11px;border-radius:10px;cursor:pointer}.btn:hover{background:#213153}.btn.primary{background:#1f4d68;border-color:#37739a}.btn.danger{color:#fecaca}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.note{font-size:12px;color:var(--muted);line-height:1.5}.back{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0 0 8px}.hidden{display:none!important}.mobile-nav{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}.sidebar{display:none}.mobile-nav{display:flex;position:fixed;z-index:40;bottom:10px;left:10px;right:10px;background:rgba(17,25,44,.95);border:1px solid var(--line);border-radius:16px;padding:7px;gap:4px;justify-content:space-around;backdrop-filter:blur(14px)}.mobile-nav button{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:10px;font-size:11px}.mobile-nav button.active{background:#243454;color:var(--text)}.main{padding-bottom:76px}.c8,.c7,.c6,.c5,.c4,.c3{grid-column:span 12}.domains{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}h1{font-size:25px}.topbar-inner{padding:12px}.graph-wrap{height:300px}.whiteboard{height:380px}}
</style>
</head>
<body>
<div class="app"><header class="topbar"><div class="topbar-inner"><div class="brand"><div class="logo"></div><div><b>LearningOps</b><small>Human–AI Learning Cockpit</small></div></div><span id="corePill" class="pill">Core</span></div></header><div class="layout"><aside class="sidebar"><div class="navgroup">Cockpit</div><button class="navbtn active" data-view="overview">Overview</button><button class="navbtn" data-view="domains">Domains</button><button class="navbtn" data-view="graph">Knowledge Graph</button><button class="navbtn" data-view="pdi">PDI</button><button class="navbtn" data-view="history">History</button><button class="navbtn" data-view="whiteboard">Whiteboard</button><div class="navgroup">Governança</div><button class="navbtn" data-view="lineage">Evidence Lineage</button></aside><main class="main" id="main"></main></div><nav class="mobile-nav"><button class="active" data-view="overview">Home</button><button data-view="domains">Domínios</button><button data-view="graph">Grafo</button><button data-view="whiteboard">Desenhar</button></nav></div>
<script>
const FALLBACK={core_version:"0.3.0",generated_at:"2026-08-16T06:01:00-03:00",domains:[{domain:"modern-data-architecture",title:"Modern Data Architecture",status_label:"Não iniciado",observed_mastery:0,generalist_breadth:0,specialist_depth:0,evidence_count:0,validated_competencies:0,current_session:null},{domain:"human-ai-cognitive-engineering",title:"Human–AI Cognitive Engineering",status_label:"Não iniciado",observed_mastery:0,generalist_breadth:0,specialist_depth:0,evidence_count:0,validated_competencies:0,current_session:null}]};let state=FALLBACK,currentView="overview",currentDomain=null;const main=document.getElementById("main");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const clamp=n=>Math.max(0,Math.min(100,Number(n||0)));function setNav(view){document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view===view))}function metrics(d){return `<div class="mini-grid"><div class="mini"><b>${clamp(d.generalist_breadth)}%</b><small>Generalista</small></div><div class="mini"><b>${clamp(d.specialist_depth)}%</b><small>Especialista</small></div><div class="mini"><b>${Number(d.evidence_count||0)}</b><small>Evidências</small></div></div>`}function domainCard(d){return `<article class="card domain-card" onclick="openDomain('${esc(d.domain)}')"><div class="domain-title"><div><h2>${esc(d.title)}</h2><div class="muted">${esc(d.status_label||"Não iniciado")}</div></div><span class="status">${esc(d.current_session||"Sem sessão")}</span></div><div class="score">${clamp(d.observed_mastery)}%</div><div class="kpi-label">mastery observado</div><div class="bar"><span style="width:${clamp(d.observed_mastery)}%"></span></div>${metrics(d)}${Number(d.evidence_count||0)===0?'<div class="empty">Sem evidência de aprendizagem ainda. O domínio permanece no zero baseline.</div>':""}</article>`}function hero(title,sub,extra=""){return `<section class="hero"><div><div class="eyebrow">LearningOps</div><h1>${title}</h1><div class="muted">${sub}</div></div>${extra}</section>`}
function renderOverview(){const totalEv=state.domains.reduce((a,d)=>a+Number(d.evidence_count||0),0);const avg=state.domains.length?Math.round(state.domains.reduce((a,d)=>a+clamp(d.observed_mastery),0)/state.domains.length):0;main.innerHTML=hero("Learning Cockpit","Um único painel para todos os campos de estudo.",`<span class="pill">Snapshot ${esc((state.generated_at||"").slice(0,16).replace("T"," "))}</span>`)+`<section class="grid"><article class="card c3"><div class="kpi-label">Mastery médio observado</div><div class="kpi">${avg}%</div><div class="bar"><span style="width:${avg}%"></span></div></article><article class="card c3"><div class="kpi-label">Domínios</div><div class="kpi">${state.domains.length}</div><div class="note">Study planes registrados</div></article><article class="card c3"><div class="kpi-label">Evidências</div><div class="kpi">${totalEv}</div><div class="note">Eventos de aprendizagem avaliáveis</div></article><article class="card c3"><div class="kpi-label">Knowledge debt</div><div class="kpi">0</div><div class="note">Surge somente após evidência</div></article><article class="card c12"><div class="section-title"><h2>Campos de estudo</h2><span class="badge zero">Zero baseline ativo</span></div><div class="domains">${state.domains.map(domainCard).join("")}</div></article><article class="card c7"><div class="section-title"><h2>Próximas ações</h2></div><div class="list">${state.domains.map(d=>`<div class="row"><div><b>${esc(d.title)}</b><br><small>${d.current_session?esc(d.current_session):"Aguardando primeira intenção de estudo"}</small></div><span class="badge">${d.current_session?"Continuar":"Foundations"}</span></div>`).join("")}</div></article><article class="card c5"><div class="section-title"><h2>Guardrails</h2></div><div class="list"><div class="row"><span>No metric without evidence</span><span class="badge good">Ativo</span></div><div class="row"><span>Zero baseline</span><span class="badge good">Ativo</span></div><div class="row"><span>Human / AI separation</span><span class="badge good">Ativo</span></div></div></article></section>`}
function renderDomains(){main.innerHTML=hero("Domains","Cada domínio mantém estado e evidência próprios.")+`<section class="domains">${state.domains.map(domainCard).join("")}</section>`}function openDomain(id){currentDomain=state.domains.find(d=>d.domain===id);currentView="domain";setNav("");renderDomain("overview")}function renderDomain(tab="overview"){const d=currentDomain;if(!d)return renderDomains();const tabs=["overview","pdi","competencies","sessions","evidence","gaps"];const content={overview:`<section class="grid"><article class="card c4"><div class="kpi-label">Observed mastery</div><div class="kpi">${clamp(d.observed_mastery)}%</div><div class="bar"><span style="width:${clamp(d.observed_mastery)}%"></span></div></article><article class="card c4"><div class="kpi-label">Generalist breadth</div><div class="kpi">${clamp(d.generalist_breadth)}%</div></article><article class="card c4"><div class="kpi-label">Specialist depth</div><div class="kpi">${clamp(d.specialist_depth)}%</div></article><article class="card c12"><h2>Estado atual</h2><div class="empty">${d.evidence_count?`${d.evidence_count} evidências registradas.`:"Nenhuma competência foi validada. A primeira sessão será Foundations e o diagnóstico produzirá as primeiras evidências."}</div></article></section>`,pdi:`<section class="grid"><article class="card c6"><h2>Objetivo</h2><p class="note">Evoluir do zero baseline até domínio generalista e especialista comprovado por evidência.</p></article><article class="card c6"><h2>Próxima intervenção</h2><p class="note">${d.current_session?"Continuar a sessão ativa.":"Iniciar 01 — Foundations por intenção natural de estudo."}</p></article><article class="card c12"><h2>Prioridades</h2><div class="empty">Prioridades serão criadas após o primeiro diagnóstico. Não inferimos gaps antes de evidência.</div></article></section>`,competencies:`<section class="card"><h2>Competency Matrix</h2><div class="empty">Ainda não há competências observadas. A matriz será preenchida com exposição, compreensão, aplicação, profundidade e confiança.</div></section>`,sessions:`<section class="card"><h2>Sessions</h2><div class="empty">${d.current_session?`Sessão atual: ${esc(d.current_session)}`:"Nenhuma sessão começou. A primeira conversa com intenção de estudo inicializa 01 — Foundations."}</div></section>`,evidence:`<section class="card"><h2>Evidence Ledger</h2><div class="empty">${d.evidence_count?`${d.evidence_count} registros disponíveis.`:"Sem evidências de aprendizagem. Eventos de baseline não aumentam mastery."}</div></section>`,gaps:`<section class="card"><h2>Gaps & Misconceptions</h2><div class="empty">Nenhum gap é inventado no baseline. Eles aparecem somente após comportamento observável.</div></section>`}[tab];main.innerHTML=`<button class="back" onclick="currentDomain=null;go('domains')">← Todos os domínios</button>`+hero(esc(d.title),`${clamp(d.observed_mastery)}% mastery observado · ${Number(d.evidence_count||0)} evidências`,`<span class="pill">${esc(d.current_session||"Sem sessão")}</span>`)+`<div class="tabs">${tabs.map(t=>`<button class="tab ${t===tab?"active":""}" onclick="renderDomain('${t}')">${({overview:"Overview",pdi:"PDI",competencies:"Competências",sessions:"Sessões",evidence:"Evidências",gaps:"Gaps"})[t]}</button>`).join("")}</div>${content}`}
function renderGraph(){const nodes=[];state.domains.forEach((d,i)=>nodes.push({name:d.title,x:i?72:28,y:50,dim:d.evidence_count===0}));main.innerHTML=hero("Knowledge Graph","Mapa navegável de domínios e conhecimento consolidado.")+`<section class="card"><div class="graph-wrap">${nodes.map(n=>`<button class="gnode ${n.dim?"dim":""}" style="left:${n.x}%;top:${n.y}%">${esc(n.name)}</button>`).join("")}<div class="gnode dim" style="left:50%;top:20%">LearningOps Core</div></div><p class="note">No zero baseline o grafo mostra apenas os domínios registrados. Conceitos e relações surgirão da wiki versionada.</p></section>`}function renderPDI(){main.innerHTML=hero("PDI","Plano de desenvolvimento consolidado entre domínios.")+`<section class="grid">${state.domains.map(d=>`<article class="card c6"><div class="section-title"><h2>${esc(d.title)}</h2><span class="badge zero">${clamp(d.observed_mastery)}%</span></div><div class="list"><div class="row"><span>Estado</span><small>${esc(d.status_label)}</small></div><div class="row"><span>Gap prioritário</span><small>Evidence insufficient</small></div><div class="row"><span>Próxima ação</span><small>01 — Foundations</small></div></div></article>`).join("")}</section>`}function renderHistory(){main.innerHTML=hero("History","Linha do tempo de evolução observada.")+`<section class="card"><div class="timeline">${state.domains.map(d=>`<div class="event"><b>${esc(d.title)} inicializado</b><div class="note">Zero baseline · Core v${esc(state.core_version)} · sem mastery pré-carregado</div></div>`).join("")}</div></section>`}function renderLineage(){main.innerHTML=hero("Evidence Lineage","Toda métrica deve ser explicável até a origem.")+`<section class="grid"><article class="card c6"><h2>Invariantes</h2><div class="list"><div class="row"><span>No metric without evidence</span><span class="badge good">Enforced</span></div><div class="row"><span>No evidence without timestamp</span><span class="badge good">Enforced</span></div><div class="row"><span>No mastery without lineage</span><span class="badge good">Enforced</span></div></div></article><article class="card c6"><h2>Estado atual</h2><div class="empty">Não há deltas de mastery para auditar. Ambos os domínios estão em 0%.</div></article></section>`}
let wbNodes=JSON.parse(localStorage.getItem("learningops-wb")||"[]");function renderWhiteboard(){main.innerHTML=hero("Learning Whiteboard","Rascunhe arquiteturas e raciocínio visual sem ferramenta externa.")+`<section class="card"><div class="wb-tools"><button class="btn primary" onclick="addWNode()">+ Componente</button><button class="btn" onclick="addWNote()">+ Nota</button><button class="btn danger" onclick="clearWB()">Limpar quadro</button></div><div id="whiteboard" class="whiteboard"></div><p class="note">MVP: componentes arrastáveis persistem localmente no navegador. O whiteboard ainda não escreve no GitHub; somente evidência consolidada deve ser versionada.</p></section>`;drawWB()}function drawWB(){const board=document.getElementById("whiteboard");if(!board)return;board.innerHTML=wbNodes.map((n,i)=>`<div class="wnode" data-i="${i}" style="left:${n.x}px;top:${n.y}px">${esc(n.text)}</div>`).join("");board.querySelectorAll(".wnode").forEach(el=>makeDrag(el))}function addWNode(){wbNodes.push({text:"Componente",x:40+wbNodes.length*18,y:50+wbNodes.length*14});saveWB();drawWB()}function addWNote(){const text=prompt("Nota:");if(text){wbNodes.push({text,x:60+wbNodes.length*18,y:80+wbNodes.length*12});saveWB();drawWB()}}function clearWB(){if(confirm("Limpar o whiteboard local?")){wbNodes=[];saveWB();drawWB()}}function saveWB(){localStorage.setItem("learningops-wb",JSON.stringify(wbNodes))}function makeDrag(el){let dragging=false,ox=0,oy=0;const idx=Number(el.dataset.i);el.addEventListener("pointerdown",e=>{dragging=true;el.setPointerCapture(e.pointerId);ox=e.clientX-el.offsetLeft;oy=e.clientY-el.offsetTop});el.addEventListener("pointermove",e=>{if(!dragging)return;const b=el.parentElement.getBoundingClientRect();const x=Math.max(0,Math.min(b.width-el.offsetWidth,e.clientX-b.left-ox));const y=Math.max(0,Math.min(b.height-el.offsetHeight,e.clientY-b.top-oy));el.style.left=x+"px";el.style.top=y+"px";wbNodes[idx].x=x;wbNodes[idx].y=y});el.addEventListener("pointerup",()=>{dragging=false;saveWB()})}function go(view){currentView=view;currentDomain=null;setNav(view);({overview:renderOverview,domains:renderDomains,graph:renderGraph,pdi:renderPDI,history:renderHistory,whiteboard:renderWhiteboard,lineage:renderLineage}[view]||renderOverview)()}document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));async function boot(){try{if(window.LEARNINGOPS_SNAPSHOT)state=window.LEARNINGOPS_SNAPSHOT;else{const r=await fetch("./snapshot.json",{cache:"no-store"});if(r.ok)state=await r.json()}}catch(e){}document.getElementById("corePill").textContent=`Core v${state.core_version||"—"}`;go("overview")}boot();
</script>
</body>
</html>
